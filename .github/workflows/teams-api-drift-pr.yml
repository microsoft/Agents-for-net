name: Teams API Drift Detector (PR)

# Compares a declared Microsoft.Teams.Apps update with the extension's recorded usage.
# An agent reviews every API change against source; deterministic checks validate evidence and builds.
on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Baseline Microsoft.Teams.Apps version (defaults to the repository declaration)
        required: false
        type: string
      to_version:
        description: Candidate Microsoft.Teams.Apps version (defaults to the repository declaration)
        required: false
        type: string
  pull_request:
    branches:
      - main
      - 'rel/**'
    paths:
      - Directory.Packages.props

permissions:
  contents: read

env:
  ARTIFACTS: artifacts/teams-api-drift
  TOOL: scripts/TeamsApiDrift/Microsoft.Agents.TeamsApiDrift.csproj
  TESTS: src/tests/Microsoft.Agents.Extensions.MSTeams.Tests/Microsoft.Agents.Extensions.MSTeams.Tests.csproj
  MANIFEST: scripts/TeamsApiDrift/teams-api-usage.json
  CAPABILITIES: scripts/TeamsApiDrift/teams-capabilities.json

concurrency:
  group: teams-api-drift-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve comparison versions
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.resolve.outputs.from }}
      to: ${{ steps.resolve.outputs.to }}
      same: ${{ steps.resolve.outputs.same }}
      artifact_id: ${{ steps.stage_artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build version resolver
        shell: bash
        run: |
          mkdir -p "$ARTIFACTS"
          dotnet build "$TOOL" -c Release 2>&1 | tee "$ARTIFACTS/version-tool-build.log"

      - name: Resolve baseline and candidate
        id: resolve
        shell: bash
        env:
          DISPATCH_FROM_VERSION: ${{ inputs.from_version }}
          DISPATCH_TO_VERSION: ${{ inputs.to_version }}
        run: |
          mkdir -p "$ARTIFACTS"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            from=$(git show "${{ github.event.pull_request.base.sha }}:Directory.Packages.props" | dotnet run --project "$TOOL" -c Release --no-build -- resolve-version --props -)
          elif [[ -n "$DISPATCH_FROM_VERSION" ]]; then
            from=$DISPATCH_FROM_VERSION
          else
            from=$(dotnet run --project "$TOOL" -c Release --no-build -- resolve-version --props Directory.Packages.props)
          fi
          if [[ -n "$DISPATCH_TO_VERSION" ]]; then
            to=$DISPATCH_TO_VERSION
          else
            to=$(dotnet run --project "$TOOL" -c Release --no-build -- resolve-version --props Directory.Packages.props)
          fi
          dotnet run --project "$TOOL" -c Release --no-build -- resolve-comparison --from "$from" --to "$to" --output "$ARTIFACTS/versions.json" 2> >(tee "$ARTIFACTS/version-resolution.log" >&2)
          echo "from=$(jq -r '.fromVersion' "$ARTIFACTS/versions.json")" >> "$GITHUB_OUTPUT"
          echo "to=$(jq -r '.toVersion' "$ARTIFACTS/versions.json")" >> "$GITHUB_OUTPUT"
          echo "same=$(jq -r '.sameVersion' "$ARTIFACTS/versions.json")" >> "$GITHUB_OUTPUT"
          jq -r '"Compared versions: `\(.fromVersion)` -> `\(.toVersion)`.\n\nVersions match: **\(.sameVersion)**. Matching versions skip all remaining jobs."' "$ARTIFACTS/versions.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer version-resolution diagnostics
        id: stage_artifact
        if: always() && steps.resolve.outputs.same != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teams-api-drift-intermediate-${{ github.run_id }}-${{ github.run_attempt }}-versions
          path: artifacts/teams-api-drift
          retention-days: 21
          if-no-files-found: warn

  deterministic:
    name: Deterministic API checks
    needs: versions
    if: needs.versions.outputs.same == 'false'
    runs-on: ubuntu-latest
    env:
      FROM_VERSION: ${{ needs.versions.outputs.from }}
      TO_VERSION: ${{ needs.versions.outputs.to }}
    outputs:
      evidence_ready: ${{ steps.compare.outcome == 'success' && steps.checks.outcome == 'success' && steps.stage_artifact.outcome == 'success' }}
      artifact_id: ${{ steps.stage_artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build drift tool
        id: tool
        continue-on-error: true
        run: dotnet build "$TOOL" -c Release

      - name: Compare normalized package metadata
        id: compare
        if: always() && steps.tool.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet run --project "$TOOL" -c Release --no-build -- compare
          --from "$FROM_VERSION" --to "$TO_VERSION"
          --source "$GITHUB_WORKSPACE/artifacts/teams-api-fixture/feed"
          --source https://api.nuget.org/v3/index.json
          --output "$ARTIFACTS"

      - name: Build MSTeams against candidate
        id: build
        if: always()
        continue-on-error: true
        run: dotnet build src/libraries/Extensions/Microsoft.Agents.Extensions.MSTeams/Microsoft.Agents.Extensions.MSTeams.csproj -c Release -p:Microsoft_Teams_Apps_PkgVer="$TO_VERSION"

      - name: Run drift tool tests
        id: drift_tests
        if: always()
        continue-on-error: true
        run: |
          dotnet test src/tests/Microsoft.Agents.TeamsApiDrift.Tests/Microsoft.Agents.TeamsApiDrift.Tests.csproj -c Release
          bash scripts/TeamsApiDrift/tests/workflow-jobs-tests.sh
          bash scripts/TeamsApiDrift/tests/run-impact-review-tests.sh

      - name: Run Teams API compile-time contracts for net8.0
        id: contract_net8
        if: always()
        continue-on-error: true
        run: dotnet test "$TESTS" -c Release -f net8.0 -p:Microsoft_Teams_Apps_PkgVer="$TO_VERSION" --filter 'Category=TeamsApiContract'

      - name: Run Teams API compile-time contracts for net10.0
        id: contract_net10
        if: always()
        continue-on-error: true
        run: dotnet test "$TESTS" -c Release -f net10.0 -p:Microsoft_Teams_Apps_PkgVer="$TO_VERSION" --filter 'Category=TeamsApiContract'

      - name: Run Teams API runtime boundary for net8.0
        id: boundary_net8
        if: always()
        continue-on-error: true
        run: dotnet test "$TESTS" -c Release -f net8.0 -p:Microsoft_Teams_Apps_PkgVer="$TO_VERSION" --filter 'Category=TeamsApiBoundary'

      - name: Run Teams API runtime boundary for net10.0
        id: boundary_net10
        if: always()
        continue-on-error: true
        run: dotnet test "$TESTS" -c Release -f net10.0 -p:Microsoft_Teams_Apps_PkgVer="$TO_VERSION" --filter 'Category=TeamsApiBoundary'

      - name: Collect actual Teams API usage
        id: collect
        if: always() && steps.build.outcome == 'success' && steps.tool.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet run --project "$TOOL" -c Release --no-build -- collect-usage
          --assembly bin/Release/CplTeams/net8.0/Microsoft.Agents.Extensions.MSTeams.dll
          --assembly bin/Release/CplTeams/net10.0/Microsoft.Agents.Extensions.MSTeams.dll
          --output "$ARTIFACTS/collected-usage.json"

      - name: Validate usage manifest
        id: manifest
        if: always() && steps.collect.outcome == 'success' && steps.compare.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet run --project "$TOOL" -c Release --no-build -- validate-usage
          --manifest "$MANIFEST" --collected "$ARTIFACTS/collected-usage.json"
          --api-model "$ARTIFACTS/microsoft-teams-apps-after.api.json"
          --repository-root "$GITHUB_WORKSPACE" --output "$ARTIFACTS/usage-validation.json"

      - name: Write independent check outcomes
        id: checks
        if: always() && steps.tool.outcome == 'success'
        run: >-
          dotnet run --project "$TOOL" -c Release --no-build -- write-test-summary
          --output "$ARTIFACTS/test-summary.json"
          --check tool=${{ steps.tool.outcome }}
          --check compare=${{ steps.compare.outcome }}
          --check build=${{ steps.build.outcome }}
          --check drift-tests=${{ steps.drift_tests.outcome }}
          --check collect=${{ steps.collect.outcome }}
          --check manifest=${{ steps.manifest.outcome }}
          --check contract-net8=${{ steps.contract_net8.outcome }}
          --check contract-net10=${{ steps.contract_net10.outcome }}
          --check boundary-net8=${{ steps.boundary_net8.outcome }}
          --check boundary-net10=${{ steps.boundary_net10.outcome }}

      - name: Transfer deterministic evidence
        id: stage_artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teams-api-drift-intermediate-${{ github.run_id }}-${{ github.run_attempt }}-deterministic
          path: artifacts/teams-api-drift
          retention-days: 21
          if-no-files-found: warn

      - name: Enforce deterministic checks
        if: always()
        shell: bash
        run: |
          failures=()
          check() { printf '%-30s %s\n' "$1" "$2"; [[ "$2" == success ]] || failures+=("$1"); }
          check tool "${{ steps.tool.outcome }}"
          check compare "${{ steps.compare.outcome }}"
          check build "${{ steps.build.outcome }}"
          check drift-tests "${{ steps.drift_tests.outcome }}"
          check collect "${{ steps.collect.outcome }}"
          check manifest "${{ steps.manifest.outcome }}"
          check contract-net8 "${{ steps.contract_net8.outcome }}"
          check contract-net10 "${{ steps.contract_net10.outcome }}"
          check boundary-net8 "${{ steps.boundary_net8.outcome }}"
          check boundary-net10 "${{ steps.boundary_net10.outcome }}"
          check checks "${{ steps.checks.outcome }}"
          check stage-artifact "${{ steps.stage_artifact.outcome }}"
          if (( ${#failures[@]} )); then printf 'Summary: Deterministic checks FAILED: %s\n' "${failures[*]}"; exit 1; fi
          echo 'Summary: Deterministic checks passed.'

  assessment:
    name: Agent assessment and validation
    needs: [versions, deterministic]
    # A failed check may still have usable evidence for the agent to explain.
    if: always() && needs.versions.outputs.same == 'false' && needs.deterministic.outputs.evidence_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    env:
      COPILOT_MODEL: ${{ vars.TEAMS_API_REVIEW_MODEL || 'gpt-5.3-codex' }}
      COPILOT_CLI_VERSION: '1.0.101'
      COPILOT_AUTO_UPDATE: 'false'
      REVIEW_WORKSPACE: ${{ github.workspace }}/.teams-impact-review
      CAN_REVIEW: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      artifact_id: ${{ steps.stage_artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build drift tool
        id: tool
        continue-on-error: true
        run: dotnet build "$TOOL" -c Release

      - name: Receive deterministic evidence
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.deterministic.outputs.artifact_id }}
          path: artifacts/teams-api-drift

      - name: Prepare repository snapshot and complete API review
        id: prepare-review
        if: always() && steps.tool.outcome == 'success' && steps.evidence.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          options=()
          if [[ "$CAN_REVIEW" != true ]]; then options+=(--defer); fi
          count=$(dotnet run --project "$TOOL" -c Release --no-build -- prepare-impact-review --comparison "$ARTIFACTS/raw-api-diff.json" --before-api "$ARTIFACTS/microsoft-teams-apps-before.api.json" --after-api "$ARTIFACTS/microsoft-teams-apps-after.api.json" --manifest "$MANIFEST" --capabilities "$CAPABILITIES" --collected "$ARTIFACTS/collected-usage.json" --test-summary "$ARTIFACTS/test-summary.json" --repository-root "$GITHUB_WORKSPACE" --workspace "$REVIEW_WORKSPACE" --output "$ARTIFACTS/review-input.json" --empty-review "$ARTIFACTS/impact-review.raw.json" "${options[@]}")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Set up Node for implementation reviewer
        if: steps.prepare-review.outcome == 'success' && steps.prepare-review.outputs.count != '0' && env.CAN_REVIEW == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install review agent
        id: install-agent
        if: steps.prepare-review.outcome == 'success' && steps.prepare-review.outputs.count != '0' && env.CAN_REVIEW == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm install --global "@github/copilot@$COPILOT_CLI_VERSION"
          echo 'Summary: Installed Copilot CLI for repository read/search review.'

      - name: Review every API change against the implementation
        id: review
        if: steps.install-agent.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/teams-impact-copilot
        run: bash scripts/TeamsApiDrift/run-impact-review.sh

      - name: Validate decisions, source evidence, and review identity
        id: validate-review
        if: always() && steps.prepare-review.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          status=0
          dotnet run --project "$TOOL" -c Release --no-build -- validate-impact-review --input "$ARTIFACTS/review-input.json" --review "$ARTIFACTS/impact-review.raw.json" --workspace "$REVIEW_WORKSPACE" --repository-root "$GITHUB_WORKSPACE" --output "$ARTIFACTS/impact-review-validation.json" --report "$ARTIFACTS/impact-report.md" || status=$?
          if [[ -f "$ARTIFACTS/impact-report.md" ]]; then cat "$ARTIFACTS/impact-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Transfer assessment diagnostics
        id: stage_artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teams-api-drift-intermediate-${{ github.run_id }}-${{ github.run_attempt }}-assessment
          path: |
            artifacts/teams-api-drift/review-input.json
            artifacts/teams-api-drift/impact-*
          retention-days: 21
          if-no-files-found: warn

      - name: Enforce implementation review
        if: always()
        shell: bash
        run: |
          failures=()
          check() { printf '%-30s %s\n' "$1" "$2"; [[ "$2" == success ]] || failures+=("$1"); }
          check review-tool "${{ steps.tool.outcome }}"
          check evidence "${{ steps.evidence.outcome }}"
          check snapshot "${{ steps.prepare-review.outcome }}"
          check review-validation "${{ steps.validate-review.outcome }}"
          check assessment-transfer "${{ steps.stage_artifact.outcome }}"
          if [[ "${{ steps.prepare-review.outputs.count }}" != 0 && "$CAN_REVIEW" == true ]]; then
            check agent-install "${{ steps.install-agent.outcome }}"
            check implementation-review "${{ steps.review.outcome }}"
          fi
          if [[ -f "$ARTIFACTS/impact-review-validation.json" ]]; then
            jq -r '.summary | "Safe: \(.safe) | Needs adaptation: \(.needsAdaptation) | Needs human review: \(.needsHumanReview) | Feature adoption (nonblocking): recommend \(.adoptionRecommendations // 0) | not needed \(.adoptionNotNeeded // 0) | product decision \(.adoptionNeedsProductDecision // 0)"' "$ARTIFACTS/impact-review-validation.json"
            jq -r '.decisions[] | select(.verdict != "safe") | "\(.changeId): \(.verdict) — \(.reason)"' "$ARTIFACTS/impact-review-validation.json"
            jq -r '.decisions[] | select(.adoption != null) | "\(.changeId): adoption \(.adoption.outcome) (nonblocking) — \(.adoption.reason)"' "$ARTIFACTS/impact-review-validation.json"
            [[ "$(jq -r '.canProceed' "$ARTIFACTS/impact-review-validation.json")" == true ]] || failures+=(impact-policy)
          else
            failures+=(missing-impact-review)
          fi
          if (( ${#failures[@]} )); then printf 'Summary: Implementation review FAILED: %s\n' "${failures[*]}"; exit 1; fi
          echo 'Summary: Implementation review passed.'

  publish:
    name: Publish report and final artifacts
    needs: [versions, deterministic, assessment]
    # Still publish diagnostics if version resolution or any later job failed.
    if: always() && needs.versions.outputs.same != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Collect versions diagnostics
        id: download_versions
        if: always() && needs.versions.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.versions.outputs.artifact_id }}
          path: artifacts/teams-api-drift

      - name: Collect deterministic diagnostics
        id: download_deterministic
        if: always() && needs.deterministic.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.deterministic.outputs.artifact_id }}
          path: artifacts/teams-api-drift

      - name: Collect assessment diagnostics
        id: download_assessment
        if: always() && needs.assessment.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assessment.outputs.artifact_id }}
          path: artifacts/teams-api-drift

      - name: Prepare final report and pipeline diagnostics
        id: report
        if: always()
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          DOWNLOAD_RESULTS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$ARTIFACTS"
          errors=()
          # Keep publication independent of checkout, compilation, and upstream success.
          load_artifact() {
            local target=$1 name=$2 shape=$3
            printf -v "$target" '%s' null
            if [[ -f "$ARTIFACTS/$name" ]]; then
              if jq -e "$shape" "$ARTIFACTS/$name" > /dev/null 2>&1; then
                printf -v "$target" '%s' "$(cat "$ARTIFACTS/$name")"
              else
                errors+=("Invalid JSON artifact: $name")
              fi
            fi
          }
          load_artifact versions versions.json 'type == "object" and (.fromVersion | type == "string") and (.toVersion | type == "string")'
          load_artifact comparison raw-api-diff.json 'type == "object" and (.changes | type == "array")'
          load_artifact checks test-summary.json 'type == "object" and (.checks | type == "object")'
          from=$(jq -nr --argjson versions "$versions" --argjson jobs "$JOB_RESULTS" '[$versions.fromVersion, $jobs.versions.outputs.from, "unresolved"] | map(select(type == "string" and length > 0)) | first')
          to=$(jq -nr --argjson versions "$versions" --argjson jobs "$JOB_RESULTS" '[$versions.toVersion, $jobs.versions.outputs.to, "unresolved"] | map(select(type == "string" and length > 0)) | first')
          jq -n --argjson jobs "$JOB_RESULTS" --argjson downloads "$DOWNLOAD_RESULTS" \
            --argjson errors "$(jq -cn --args '$ARGS.positional' "${errors[@]}")" \
            '{schemaVersion: 1, jobs: $jobs, downloads: $downloads, errors: $errors}' > "$ARTIFACTS/pipeline-status.json"
          report_path="$ARTIFACTS/impact-report.md"
          if [[ ! -f "$report_path" ]]; then
            printf '# Microsoft.Teams.Apps implementation review\n\nCompared `%s` -> `%s`.\n\n' "$from" "$to" > "$report_path"
            printf 'The pipeline did not produce a validated implementation report. See the job outcomes below and the workflow logs.\n' >> "$report_path"
          fi
          {
            printf '\n## Workflow job outcomes\n\n'
            jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$JOB_RESULTS"
            jq -r 'to_entries[] | select((.key | startswith("download_")) and .value.outcome == "failure") | "- Evidence download failed: \(.key)"' <<< "$DOWNLOAD_RESULTS"
            for error in "${errors[@]}"; do printf -- '- %s\n' "$error"; done
            if [[ "$checks" != null ]]; then
              printf '\n## Recorded independent checks\n\n'
              jq -r '.checks | to_entries[] | "- \(.key): \(.value)"' <<< "$checks"
            fi
            printf '\n[Workflow logs and complete artifacts](%s)\n' "$RUN_URL"
          } >> "$report_path"
          cat "$report_path" >> "$GITHUB_STEP_SUMMARY"
          publish_issue=$(jq -r --argjson jobs "$JOB_RESULTS" \
            'any($jobs[]; .result != "success") or . == null or (.changes | length) > 0' <<< "$comparison")
          printf 'publish_issue=%s\nfrom=%s\nto=%s\n' "$publish_issue" "$from" "$to" >> "$GITHUB_OUTPUT"
          printf 'Summary: Prepared final report; deterministic and assessment outcomes preserved. Package versions: %s -> %s.\n' "$from" "$to"

      - name: Publish implementation review comment
        if: always() && steps.report.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: artifacts/teams-api-drift/impact-report.md
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.REPORT_PATH)) {
              console.log('Summary: Review report unavailable; see validation logs.');
              return;
            }
            const marker = '<!-- teams-api-drift-report -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n${report.slice(0, 55000)}\n\n[Full report and artifacts](${runUrl})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body?.includes(marker));
            const response = existing
              ? await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              : await github.rest.issues.createComment({ owner, repo, issue_number, body });
            console.log(`Summary: Published implementation review: ${response.data.html_url}`);

      - name: Publish complete comparison and review artifacts
        id: final_artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teams-api-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/teams-api-drift
          retention-days: 21
          if-no-files-found: error

      - name: Enforce publication result
        if: always()
        shell: bash
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          mapfile -t failures < <(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<< "$STEP_RESULTS")
          if (( ${#failures[@]} )); then
            printf 'Publication requires attention: %s\n' "${failures[*]}" >&2
            exit 1
          fi
          echo 'Summary: Report publication and final artifacts completed; comparison and compatibility results remain in their originating jobs.'
