name: API compatibility report

on:
  workflow_run:
    workflows: ["API compatibility"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: api-compat-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - id: resolve-pr
        name: Resolve pull request
        uses: actions/github-script@v7
        env:
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const expectedRepository = 'microsoft/Agents-for-net';
            const workflowRepository = `${context.repo.owner}/${context.repo.repo}`;
            const headRepository = process.env.HEAD_REPOSITORY;
            const headSha = process.env.HEAD_SHA;

            if (workflowRepository.toLowerCase() !== expectedRepository.toLowerCase()) {
              throw new Error(`Unexpected workflow repository '${workflowRepository}'.`);
            }
            if (!headRepository || !headSha) {
              throw new Error('The triggering workflow run is missing head repository or SHA metadata.');
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const matches = pulls.filter(pull =>
              pull.base.repo?.full_name?.toLowerCase() === expectedRepository.toLowerCase() &&
              pull.head.repo?.full_name?.toLowerCase() === headRepository.toLowerCase() &&
              pull.head.sha === headSha
            );

            if (matches.length !== 1) {
              throw new Error(
                `Expected exactly one open pull request for ${headRepository}@${headSha} ` +
                `targeting ${expectedRepository}, but found ${matches.length}.`
              );
            }

            core.setOutput('pr-number', matches[0].number);
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: api-compat-report-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/api-compat
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Render sanitized comment
        run: >
          dotnet run -c Release
          --project src/tools/Microsoft.Agents.ApiCompat/Microsoft.Agents.ApiCompat.csproj --
          render-comment
          --report "${{ runner.temp }}/api-compat/report.json"
          --output "${{ runner.temp }}/api-compat/comment.md"
          --run-id "${{ github.event.workflow_run.id }}"
          --pr-number "${{ steps.resolve-pr.outputs.pr-number }}"
      - name: Update sticky comment
        uses: actions/github-script@v7
        env:
          COMMENT_PATH: ${{ runner.temp }}/api-compat/comment.md
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr-number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agents-sdk-api-compat -->';
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const issue_number = Number(process.env.PR_NUMBER);
            const runId = Number(process.env.RUN_ID);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            const prior = existing?.body?.match(/<!-- api-compat-run:(\d+) -->/);
            if (prior && Number(prior[1]) > runId) {
              core.info(`Skipping stale run ${runId}; comment already has run ${prior[1]}.`);
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }
